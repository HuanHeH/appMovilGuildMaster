# Edge nginx — DuckDNS hostnames on :443
# guildmaster (web), guildmasterapi (API), guildmasteradmin (API admin UI)
# phpMyAdmin: direct IP access on :8080 (not via DuckDNS)

# ACME + HTTP → HTTPS
server {
    listen 80;
    server_name guildmaster.duckdns.org guildmasterapi.duckdns.org guildmasteradmin.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Expo static web
server {
    listen 443 ssl;
    server_name guildmaster.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/guildmaster.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guildmaster.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Spring API
server {
    listen 443 ssl;
    server_name guildmasterapi.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/guildmaster.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guildmaster.duckdns.org/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}

# Spring Admin UI (same backend as API)
server {
    listen 443 ssl;
    server_name guildmasteradmin.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/guildmaster.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guildmaster.duckdns.org/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}
