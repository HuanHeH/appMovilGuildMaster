# Edge nginx — guildmasterweb.com on :443 by hostname; phpMyAdmin by IP
# App/API/Admin: guildmasterweb.com, api.guildmasterweb.com, admin.guildmasterweb.com
# phpMyAdmin: https://SERVER_IP/  and https://SERVER_IP:8445/

# ACME + HTTP → HTTPS (named hosts)
server {
    listen 80;
    server_name guildmasterweb.com api.guildmasterweb.com admin.guildmasterweb.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# IP on :80 → HTTPS phpMyAdmin
server {
    listen 80 default_server;
    server_name 187.33.148.249 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# phpMyAdmin by IP — MUST be default_server so IP does not hit Expo
server {
    listen 443 ssl default_server;
    listen 8445 ssl;
    server_name 187.33.148.249 _;

    ssl_certificate     /etc/letsencrypt/live/guildmasterweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guildmasterweb.com/privkey.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}

# Expo static web (hostname only — never default for IP)
server {
    listen 443 ssl;
    server_name guildmasterweb.com;

    ssl_certificate     /etc/letsencrypt/live/guildmasterweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guildmasterweb.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Spring API
server {
    listen 443 ssl;
    server_name api.guildmasterweb.com;

    ssl_certificate     /etc/letsencrypt/live/guildmasterweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guildmasterweb.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}

# Spring Admin UI
